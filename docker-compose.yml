version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    env_file:
      - config/prod.env
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - rabbitmq
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: notification-worker
    env_file:
      - config/prod.env
    depends_on:
      - redis
      - rabbitmq
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
